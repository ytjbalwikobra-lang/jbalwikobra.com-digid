<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin API Full Test</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #0a0a0a;
            color: #e0e0e0;
        }
        h1, h2 { color: #ec4899; }
        .container {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        input, button {
            padding: 10px;
            margin: 5px 0;
            border-radius: 4px;
            border: 1px solid #444;
            background: #2a2a2a;
            color: #fff;
            width: 100%;
            box-sizing: border-box;
        }
        button {
            background: linear-gradient(135deg, #ec4899, #8b5cf6);
            cursor: pointer;
            font-weight: bold;
            border: none;
        }
        button:hover { opacity: 0.9; }
        button:disabled {
            background: #333;
            cursor: not-allowed;
        }
        pre {
            background: #0a0a0a;
            border: 1px solid #333;
            padding: 15px;
            border-radius: 4px;
            overflow-x: auto;
            font-size: 12px;
        }
        .success { color: #10b981; }
        .error { color: #ef4444; }
        .warning { color: #f59e0b; }
        .info { color: #3b82f6; }
        .step {
            background: #252525;
            padding: 10px;
            margin: 10px 0;
            border-left: 3px solid #ec4899;
        }
    </style>
</head>
<body>
    <h1>🔐 Admin API Full Test</h1>
    
    <!-- Step 1: Login -->
    <div class="container">
        <h2>Step 1: Login as Admin</h2>
        <div id="loginStatus" class="step">
            <p class="info">Checking current session...</p>
        </div>
        <div id="loginForm" style="display:none;">
            <input type="text" id="phone" placeholder="Phone (e.g., 081234567890)" value="082145782345">
            <input type="password" id="password" placeholder="Password" value="admin123">
            <button onclick="doLogin()">Login</button>
        </div>
    </div>

    <!-- Step 2: Test APIs -->
    <div class="container">
        <h2>Step 2: Test Admin APIs</h2>
        <div class="step">
            <button onclick="testAllAPIs()" id="testBtn" disabled>Test All APIs</button>
        </div>
        
        <div id="results"></div>
    </div>

    <script>
        let sessionToken = null;

        // Check existing session on load
        window.addEventListener('DOMContentLoaded', () => {
            checkSession();
        });

        function checkSession() {
            sessionToken = localStorage.getItem('session_token');
            const loginStatus = document.getElementById('loginStatus');
            const loginForm = document.getElementById('loginForm');
            const testBtn = document.getElementById('testBtn');

            if (sessionToken) {
                loginStatus.innerHTML = `
                    <p class="success">✅ Session token found: ${sessionToken.substring(0, 20)}...</p>
                    <p class="info">You can now test APIs or <button onclick="showLoginForm()">Re-login</button></p>
                `;
                testBtn.disabled = false;
            } else {
                loginStatus.innerHTML = '<p class="warning">⚠️ No session token found. Please login first.</p>';
                loginForm.style.display = 'block';
            }
        }

        function showLoginForm() {
            document.getElementById('loginForm').style.display = 'block';
        }

        async function doLogin() {
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;
            const loginStatus = document.getElementById('loginStatus');

            loginStatus.innerHTML = '<p class="info">🔄 Logging in...</p>';

            try {
                const response = await fetch('/api/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'login',
                        phone: phone,
                        password: password
                    })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    sessionToken = data.session_token;
                    localStorage.setItem('session_token', sessionToken);
                    
                    loginStatus.innerHTML = `
                        <p class="success">✅ Login successful!</p>
                        <p class="info">User: ${data.user.name} (${data.user.email || 'No email'})</p>
                        <p class="info">Admin: ${data.user.is_admin ? 'Yes' : 'No'}</p>
                        <p class="success">Session token: ${sessionToken.substring(0, 30)}...</p>
                    `;
                    
                    document.getElementById('loginForm').style.display = 'none';
                    document.getElementById('testBtn').disabled = false;
                } else {
                    loginStatus.innerHTML = `<p class="error">❌ Login failed: ${data.error || 'Unknown error'}</p>`;
                }
            } catch (error) {
                loginStatus.innerHTML = `<p class="error">❌ Login error: ${error.message}</p>`;
            }
        }

        async function testAllAPIs() {
            const results = document.getElementById('results');
            results.innerHTML = '<p class="info">🔄 Testing APIs...</p>';

            if (!sessionToken) {
                results.innerHTML = '<p class="error">❌ No session token available!</p>';
                return;
            }

            const headers = {
                'Authorization': `Bearer ${sessionToken}`,
                'Content-Type': 'application/json'
            };

            let output = '';

            // Test 1: Dashboard Stats
            output += '<div class="step"><h3>1. Dashboard Stats</h3>';
            try {
                const response = await fetch('/api/admin?action=dashboard-stats', { headers });
                const data = await response.json();
                
                if (response.ok) {
                    output += `<p class="success">✅ Status: ${response.status}</p>`;
                    output += `<pre>${JSON.stringify(data, null, 2)}</pre>`;
                } else {
                    output += `<p class="error">❌ Status: ${response.status}</p>`;
                    output += `<pre>${JSON.stringify(data, null, 2)}</pre>`;
                }
            } catch (error) {
                output += `<p class="error">❌ Error: ${error.message}</p>`;
            }
            output += '</div>';

            // Test 2: Orders List
            output += '<div class="step"><h3>2. Orders List (first 5)</h3>';
            try {
                const response = await fetch('/api/admin?action=orders&page=1&limit=5', { headers });
                const data = await response.json();
                
                if (response.ok) {
                    output += `<p class="success">✅ Status: ${response.status}</p>`;
                    output += `<p class="info">Count: ${data.count || 0}, Page: ${data.page || 1}</p>`;
                    output += `<pre>${JSON.stringify(data.data || data, null, 2)}</pre>`;
                } else {
                    output += `<p class="error">❌ Status: ${response.status}</p>`;
                    output += `<pre>${JSON.stringify(data, null, 2)}</pre>`;
                }
            } catch (error) {
                output += `<p class="error">❌ Error: ${error.message}</p>`;
            }
            output += '</div>';

            // Test 3: Users List
            output += '<div class="step"><h3>3. Users List (first 5)</h3>';
            try {
                const response = await fetch('/api/admin?action=users&page=1&limit=5', { headers });
                const data = await response.json();
                
                if (response.ok) {
                    output += `<p class="success">✅ Status: ${response.status}</p>`;
                    output += `<p class="info">Count: ${data.count || 0}, Page: ${data.page || 1}</p>`;
                    output += `<pre>${JSON.stringify(data.data || data, null, 2)}</pre>`;
                } else {
                    output += `<p class="error">❌ Status: ${response.status}</p>`;
                    output += `<pre>${JSON.stringify(data, null, 2)}</pre>`;
                }
            } catch (error) {
                output += `<p class="error">❌ Error: ${error.message}</p>`;
            }
            output += '</div>';

            // Test 4: Products List
            output += '<div class="step"><h3>4. Products List (first 5)</h3>';
            try {
                const response = await fetch('/api/admin?action=products&page=1&limit=5', { headers });
                const data = await response.json();
                
                if (response.ok) {
                    output += `<p class="success">✅ Status: ${response.status}</p>`;
                    output += `<p class="info">Count: ${data.count || 0}, Page: ${data.page || 1}</p>`;
                    output += `<pre>${JSON.stringify(data.data || data, null, 2)}</pre>`;
                } else {
                    output += `<p class="error">❌ Status: ${response.status}</p>`;
                    output += `<pre>${JSON.stringify(data, null, 2)}</pre>`;
                }
            } catch (error) {
                output += `<p class="error">❌ Error: ${error.message}</p>`;
            }
            output += '</div>';

            results.innerHTML = output;
        }
    </script>
</body>
</html>
